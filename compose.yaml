services:
  model-harbor:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"
    environment:
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:?Set GATEWAY_PUBLIC_URL in .env}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?Set a strong password in .env}
      GATEWAY_API_BODY_LIMIT_MB: ${GATEWAY_API_BODY_LIMIT_MB:-64}
    volumes:
      - ./data:/app/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
